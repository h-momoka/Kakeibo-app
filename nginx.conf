# Nginxの設定ファイル。
# 役割: 外からの通信をまず受け取り（受付）、裏にいる「app」コンテナ
# （Expressサーバー、3000番)に転送するだけの、シンプルな「リバースプロキシ」。

server {
    listen 80;

    location / {
        # "app" は docker-compose.yml のサービス名。
        # コンテナ同士はこの名前で通信できる（db の時と同じ考え方)。
        proxy_pass http://app:3000;

        # 転送先(app)に、元々の情報（本当の訪問者のIPなど)を伝えるためのおまじない。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
